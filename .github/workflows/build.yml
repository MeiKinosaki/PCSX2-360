name: PCSX2-360 validation and automatic XEX build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Run EE regression tests
        run: make check

  xenon-default-xex:
    # Build automatically on pushes to main and manual dispatch.
    # The official container is expected to supply the libXenon SDK and converter.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest
    env:
      DEVKITXENON: /usr/local/xenon
    steps:
      - uses: actions/checkout@v4
      - name: Add libXenon tools to PATH
        run: |
          echo "$DEVKITXENON/bin" >> "$GITHUB_PATH"
          echo "$DEVKITXENON/usr/bin" >> "$GITHUB_PATH"
      - name: Verify Xenon compiler, linker inputs and XEX converter
        run: |
          set -euo pipefail
          command -v xenon-gcc
          command -v xenon-elf2xex
          test -s "$DEVKITXENON/app.lds"
          test -s "$DEVKITXENON/usr/lib/libxenon.a"
      - name: Run host regressions and generate default.xex
        run: |
          set -euo pipefail
          make clean
          make check
          make xex
          test -s build/default.xex
          ! test -e build/pcsx2-360.elf.tmp
          ! test -e build/default.xex.tmp
          sha256sum build/default.xex > build/default.xex.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PCSX2-360-default-xex-${{ github.run_number }}
          path: |
            build/default.xex
            build/default.xex.sha256
          if-no-files-found: error
          retention-days: 30
